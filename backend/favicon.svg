    <path d="
      M32 7V14
      M32 50V57
      M7 32H14
      M50 32H57
      M14 14L19 19
      M45 45L50 50
      M50 14L45 19
      M19 45L14 50
    "/>
  </g>

  <!-- Medical cross -->
  <rect x="26" y="18"
        width="12" height="28"
        rx="3" fill="url(#cross)"/>

  <rect x="18" y="26"
        width="28" height="12"
        rx="3" fill="url(#cross)"/>

