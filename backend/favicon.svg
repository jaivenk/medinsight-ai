                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#91f2df"/>
      <stop offset="100%" stop-color="#2cb6be"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="16"
